<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="傾斜的綠色 PDF 書本圖示"
>
  <defs>
    <!-- 封面漸層 -->
    <linearGradient id="coverGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1597A5"/>
      <stop offset="100%" stop-color="#087783"/>
    </linearGradient>

    <!-- 書頁的暖白漸層 -->
    <linearGradient id="pageGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7E3DA"/>
      <stop offset="35%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F0EDE5"/>
    </linearGradient>

    <!-- 陰影 -->
    <filter id="bookShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow
        dx="10"
        dy="16"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>

    <!-- PDF 字樣陰影 -->
    <filter id="textShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow
        dx="7"
        dy="9"
        stdDeviation="1.5"
        flood-color="#003F48"
        flood-opacity="0.9"
      />
    </filter>

    <!-- 書頁裁切範圍 -->
    <clipPath id="pageClip">
      <path d="
        M 393 108
        L 445 137
        Q 455 143 453 158
        L 431 406
        Q 429 424 413 426
        L 375 417
        Z
      "/>
    </clipPath>
  </defs>

  <!-- 透明背景 -->
  <g filter="url(#bookShadow)">

    <!-- 後封面，從右側與下側稍微露出 -->
    <path
      d="
        M 119 73
        L 414 102
        Q 429 104 436 118
        L 454 148
        L 431 415
        Q 429 433 410 434
        L 92 398
        Z
      "
      fill="#087481"
    />

    <!-- 右側書頁厚度 -->
    <path
      d="
        M 393 108
        L 445 137
        Q 455 143 453 158
        L 431 406
        Q 429 424 413 426
        L 375 417
        Z
      "
      fill="url(#pageGradient)"
    />

    <!-- 頁面分層線，全部沿著書本透視方向傾斜 -->
    <g
      clip-path="url(#pageClip)"
      fill="none"
      stroke="#D5D0C7"
      stroke-width="2"
      opacity="0.8"
    >
      <path d="M 405 113 L 387 419"/>
      <path d="M 416 118 L 398 422"/>
      <path d="M 427 124 L 409 424"/>
      <path d="M 438 130 L 420 421"/>
    </g>

    <!-- 綠色前封面 -->
    <path
      d="
        M 93 67
        L 399 96
        Q 417 98 414 117
        L 386 403
        Q 384 421 365 418
        L 75 386
        Q 57 384 59 366
        L 78 85
        Q 80 65 93 67
        Z
      "
      fill="url(#coverGradient)"
    />

    <!-- 封面右側的薄亮邊，強調封面與書頁交界 -->
    <path
      d="M 399 99 Q 413 102 411 118 L 385 397"
      fill="none"
      stroke="#49B9C0"
      stroke-width="3"
      opacity="0.55"
    />

    <!-- 左側書脊區域 -->
    <path
      d="
        M 93 67
        L 133 71
        L 110 390
        L 75 386
        Q 57 384 59 366
        L 78 85
        Q 80 65 93 67
        Z
      "
      fill="#096B76"
      opacity="0.72"
    />

    <!-- 書脊壓線 -->
    <path
      d="M 106 69 L 84 387"
      fill="none"
      stroke="#034F59"
      stroke-width="4"
      opacity="0.75"
    />

    <path
      d="M 133 72 L 110 390"
      fill="none"
      stroke="#055965"
      stroke-width="5"
      opacity="0.8"
    />

    <!-- PDF 字樣，稍微配合書本角度 -->
    <g
      transform="translate(236 253) rotate(5.4) skewX(-2) translate(-236 -253)"
      filter="url(#textShadow)"
    >
      <text
        x="143"
        y="287"
        font-family="Arial, Helvetica, sans-serif"
        font-size="92"
        font-weight="900"
        letter-spacing="-3"
        fill="#118692"
        stroke="#FFFFFF"
        stroke-width="8"
        paint-order="stroke fill"
      >
        PDF
      </text>
    </g>
  </g>
</svg>
