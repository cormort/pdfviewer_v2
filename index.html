        <div class="fab-group-label">顯示</div>
        <button id="fab-fit-width-btn" class="btn-secondary fit-width-btn" title="符合寬度" aria-label="符合寬度">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-move-horizontal"/></svg></span>
        </button>
        <button id="fab-fit-height-btn" class="btn-secondary fit-height-btn" title="符合高度" aria-label="符合高度">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-move-vertical"/></svg></span>
        </button>
        <button id="reading-mode-btn" class="btn-secondary" title="閱讀模式：隱藏按鈕，輕點畫面叫回" aria-label="閱讀模式">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-book-open"/></svg></span>
        </button>

        <div class="fab-divider"></div>
        <div class="fab-group-label">文字工具</div>
        <button id="toggle-underline-btn" class="btn-secondary" title="切換搜尋底線" aria-label="切換搜尋底線">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-underline"/></svg></span>
        </button>
        <button id="toggle-highlighter-btn" class="btn-secondary" title="螢光筆標記選擇內容" aria-label="螢光筆標記選擇內容">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-highlighter"/></svg></span>
        </button>
        <button id="clear-highlighter-btn" class="btn-secondary" title="清除本頁標記" aria-label="清除本頁標記">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eraser"/></svg></span>
        </button>

        <div class="fab-divider"></div>
        <div class="fab-group-label">選取與筆記</div>
        <button id="toggle-text-selection-btn" class="btn-secondary" title="選擇文字" aria-label="選擇文字">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-text-cursor"/></svg></span>
        </button>
        <button id="toggle-paragraph-selection-btn" class="btn-secondary" title="選擇段落" aria-label="選擇段落">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pilcrow"/></svg></span>
        </button>
        <button id="copy-page-text-btn" class="btn-secondary" title="複製選擇內容" aria-label="複製選擇內容">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-clipboard-copy"/></svg></span>
        </button>
        <button id="view-notes-btn" class="btn-secondary" title="所有分頁筆記" aria-label="所有分頁筆記">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-notebook-text"/></svg></span>
        </button>
        <button id="toggle-local-magnifier-btn" class="btn-secondary" title="放大鏡 (點擊 PDF)" aria-label="放大鏡 (點擊 PDF)">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-zoom-in"/></svg></span>
        </button>
        <button id="toggle-notes-btn" class="btn-secondary" title="新增筆記 (點擊 PDF)" aria-label="新增筆記 (點擊 PDF)">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg></span>
        </button>
      </div>
    </div>

    <div id="reading-bar">
      <button id="reading-search-btn" class="btn-secondary" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg> 搜尋</button>
      <button id="reading-exit-btn" class="btn-primary" type="button">結束閱讀</button>
    </div>

    <!-- Zoom Controls Overlay -->
    <div class="page-nav-overlay">
      <button id="zoom-out-btn" class="zoom-out-btn" title="縮小" aria-label="縮小"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-minus"/></svg></button>
      <div id="zoom-level-display">100%</div>
      <button id="zoom-in-btn" class="zoom-in-btn" title="放大" aria-label="放大"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
      <div class="toolbar-divider"></div>
      <button id="fit-width-btn" class="fit-width-btn">寬度</button>
      <button id="fit-height-btn" class="fit-height-btn">高度</button>
      <div class="toolbar-divider"></div>
      <div id="page-chip" aria-live="polite">–/–</div>
      <input type="range" id="page-slider" min="1" max="1" value="1" disabled>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
      <div class="loading-content">
        <div class="loading-spinner-large"></div>
        <div id="loading-message" class="loading-message">載入中...</div>
      </div>
    </div>

    <!-- Note Modal -->
    <div id="update-banner" class="no-print" role="status" hidden>
      <span>有新版本可以使用</span>
      <button id="update-reload-btn" class="btn-primary" type="button">立即更新</button>
      <button id="update-dismiss-btn" class="close-btn" type="button" title="稍後" aria-label="稍後再更新"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
    </div>

    <div id="changelog-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="changelog-title">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="changelog-title">更新紀錄</h3>
          <button id="close-changelog" class="close-btn" title="關閉" aria-label="關閉更新紀錄"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
        </div>
        <div id="changelog-body" class="modal-body"></div>
      </div>
    </div>

    <div id="note-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="note-modal-title">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="note-modal-title">新增筆記</h3>
          <button id="close-note-modal" class="close-btn" title="關閉" aria-label="關閉筆記視窗"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
        </div>
        <div class="modal-body">
          <textarea id="note-content" placeholder="在此輸入筆記內容..."></textarea>
        </div>
        <div class="modal-footer">
          <button id="delete-note-btn" class="btn-danger" style="display:none;">刪除</button>
          <button id="cancel-note-btn" class="btn-secondary">取消</button>
          <button id="save-note-btn" class="btn-primary">儲存筆記</button>
        </div>
      </div>
    </div>

    <!-- Notes List Panel -->
    <div id="notes-list-panel" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="notes-list-title">
      <div class="modal-content side-panel">
        <div class="modal-header">
          <h3 id="notes-list-title">所有分頁筆記</h3>
          <button id="close-notes-list" class="close-btn" title="關閉" aria-label="關閉筆記清單"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
        </div>
        <div id="notes-list-container" class="modal-body">
          <!-- Notes will be loaded here -->
        </div>
        <div class="modal-footer backup-actions">
          <button id="export-notes-btn" class="btn-secondary" title="將所有筆記匯出為 JSON 檔案" aria-label="將所有筆記匯出為 JSON 檔案"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-download"/></svg> 匯出備份</button>
          <button id="import-notes-trigger-btn" class="btn-secondary" title="從 JSON 備份檔案匯入筆記" aria-label="從 JSON 備份檔案匯入筆記"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-upload"/></svg> 匯入備份</button>
          <input type="file" id="import-notes-input" accept=".json" class="sr-only">
        </div>
      </div>
    </div>

    <!-- Magnifier Zoom Controls -->
    <div id="local-magnifier-zoom-controls" class="magnifier-zoom-overlay" style="display: none;">
      <label>縮放：</label>
      <select id="local-magnifier-zoom-selector">
        <option value="1.5">1.5x</option>
        <option value="2.0" selected>2.0x</option>
        <option value="2.5">2.5x</option>
        <option value="3.0">3.0x</option>
        <option value="3.5">3.5x</option>
      </select>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./script.js?v=71"></script>
</body>

</html>
