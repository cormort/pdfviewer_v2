<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF關鍵字搜尋平台</title>
  <link rel="stylesheet" href="style.css">
  <script type="module">
    // Load PDF.js from local files (ES Module)
    import * as pdfjsLib from './lib/pdfjs/pdf.mjs';
    window.pdfjsLib = pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdfjs/pdf.worker.mjs';
  </script>
</head>

<body>
  <div id="app-container">
    <div id="toolbar-toggle-tab" title="切換選單">
      <span class="icon">☰</span>
    </div>
    <header id="toolbar">
      <div class="title-section">
        <div class="app-logo">PDF</div>
        <h1 class="app-title">搜索平台</h1>
      </div>

      <div class="file-section">
        <button id="restore-session-btn" class="btn-secondary" title="恢復上一個工作階段">🔄 恢復</button>
        <button id="clear-session-btn" class="btn-danger" style="display: none;" title="清除工作階段">🗑️
          清除</button>
        <label for="fileInput" class="custom-file-upload">
          <span>📁 上傳 PDF</span>
          <input type="file" id="fileInput" multiple accept="application/pdf">
        </label>
      </div>

      <div class="search-section">
        <input type="text" id="searchInput" placeholder="搜尋關鍵字..." autocomplete="off">
        <button id="search-action-button" class="btn-primary">搜尋</button>
        <select id="fileFilterDropdown">
          <option value="all">所有檔案</option>
        </select>
      </div>

      <div class="file-switch-section">
        <select id="fileSwitchDropdown" title="在已載入的檔案之間切換">
          <option value="">-- 選擇檔案 --</option>
        </select>
      </div>

      <div class="nav-section">
        <button id="go-to-first-page" title="第一頁">«</button>
        <button id="prev-page" title="上一頁">‹</button>
        <div id="page-num-display">第 - / - 頁</div>
        <button id="next-page" title="下一頁">›</button>
        <input type="number" id="page-to-go" min="1" value="1" title="前往頁面">
        <button id="go-to-page-btn" class="btn-secondary">前往</button>
      </div>

      <a href="https://github.com/hsiehminchieh" target="_blank" id="help-link" title="說明與支援">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </a>
    </header>

    <main id="main-content">
      <section id="pdf-container">
        <!-- Empty State -->
        <div id="empty-state" class="empty-state-guide">
          <div class="icon">📄</div>
          <h2>開始您的專案</h2>
          <p>上傳 PDF 以啟用關鍵字搜尋、分頁筆記等功能。</p>
        </div>

        <!-- PDF Content Wrapper -->
        <div id="canvas-wrapper" style="position: relative; display: none;">
          <canvas id="pdf-canvas"></canvas>
          <div id="text-layer"></div>
          <canvas id="drawing-canvas"></canvas>
          <div id="magnifier-glass">
            <canvas id="magnifier-canvas"></canvas>
          </div>
          <div id="notes-layer"></div>
        </div>
      </section>

      <div id="resizer"></div>

      <div id="search-results-panel">
        <h3>🔍 搜尋結果</h3>
        <div id="panel-dropdown-container">
          <select id="panelFileFilterDropdown">
            <option value="all">所有檔案</option>
          </select>
          <select id="panelResultsDropdown">
            <option value="">搜尋結果</option>
          </select>
        </div>
        <div id="results-list"></div>
      </div>
    </main>

    <!-- Floating Action Buttons -->
    <div id="floating-action-buttons" class="fab-container">
      <!-- Overlay Panel Trigger (Mobile Speed Dial) -->
      <button id="main-fab" class="btn-primary" title="工具選單">
        <span class="icon">🛠️</span>
      </button>

      <div class="fab-menu" id="fab-speed-dial">
        <button id="toggle-underline-btn" class="btn-secondary" title="切換搜尋底線">
          <span class="icon">S̲</span>
        </button>
        <div class="fab-divider"></div>
        <button id="toggle-notes-btn" class="btn-secondary" title="新增筆記 (點擊 PDF)">
          <span class="icon">📌</span>
        </button>
        <button id="view-notes-btn" class="btn-secondary" title="所有分頁筆記">
          <span class="icon">📝</span>
        </button>
        <button id="toggle-highlighter-btn" class="btn-secondary" title="螢光筆標記選擇內容">
          <span class="icon">🖍️</span>
        </button>
        <button id="clear-highlighter-btn" class="btn-secondary" title="清除所有標記">
          <span class="icon">🧹</span>
        </button>
        <div class="fab-divider"></div>
        <button id="toggle-text-selection-btn" class="btn-secondary" title="選擇文字">
          <span class="icon">📄</span>
        </button>
        <button id="toggle-paragraph-selection-btn" class="btn-secondary" title="選擇段落">
          <span class="icon">¶</span>
        </button>
        <button id="copy-page-text-btn" class="btn-secondary" title="複製選擇內容">
          <span class="icon">📋</span>
        </button>
        <div class="fab-divider"></div>
        <button id="share-page-btn" class="btn-secondary" title="分享 PDF">
          <span class="icon">🔗</span>
        </button>
        <button id="export-page-btn" class="btn-secondary" title="匯出為 Word/Excel">
          <span class="icon">📤</span>
        </button>
        <button id="toggle-local-magnifier-btn" class="btn-secondary" title="放大鏡 (點擊 PDF)">
          <span class="icon">🔍</span>
        </button>
      </div>
    </div>

    <!-- Zoom Controls Overlay -->
    <div class="page-nav-overlay">
      <button id="zoom-out-btn" class="zoom-out-btn" title="縮小">-</button>
      <div id="zoom-level-display">100%</div>
      <button id="zoom-in-btn" class="zoom-in-btn" title="放大">+</button>
      <div class="toolbar-divider"></div>
      <button id="fit-width-btn" class="fit-width-btn">寬度</button>
      <button id="fit-height-btn" class="fit-height-btn">高度</button>
      <div class="toolbar-divider"></div>
      <input type="range" id="page-slider" min="1" max="1" value="1" disabled>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
      <div class="loading-content">
        <div class="loading-spinner-large"></div>
        <div id="loading-message">載入中...</div>
      </div>
    </div>

    <!-- Note Modal -->
    <div id="note-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="note-modal-title">新增筆記</h3>
          <button id="close-note-modal" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <textarea id="note-content" placeholder="在此輸入筆記內容..."></textarea>
        </div>
        <div class="modal-footer">
          <button id="delete-note-btn" class="btn-danger" style="display:none;">刪除</button>
          <button id="cancel-note-btn" class="btn-secondary">取消</button>
          <button id="save-note-btn" class="btn-primary">儲存筆記</button>
        </div>
      </div>
    </div>

    <!-- Notes List Panel -->
    <div id="notes-list-panel" class="modal-overlay">
      <div class="modal-content side-panel">
        <div class="modal-header">
          <h3>所有分頁筆記</h3>
          <button id="close-notes-list" class="close-btn">&times;</button>
        </div>
        <div id="notes-list-container" class="modal-body">
          <!-- Notes will be loaded here -->
        </div>
        <div class="modal-footer backup-actions">
          <button id="export-notes-btn" class="btn-secondary" title="將所有筆記匯出為 JSON 檔案">📤 匯出備份</button>
          <button id="import-notes-trigger-btn" class="btn-secondary" title="從 JSON 備份檔案匯入筆記">📥 匯入備份</button>
          <input type="file" id="import-notes-input" accept=".json" style="display: none;">
        </div>
      </div>
    </div>

    <!-- Magnifier Zoom Controls -->
    <div id="local-magnifier-zoom-controls" class="magnifier-zoom-overlay" style="display: none;">
      <label>縮放：</label>
      <select id="local-magnifier-zoom-selector">
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
        <option value="2.5" selected>2.5x</option>
        <option value="3.0">3.0x</option>
        <option value="3.5">3.5x</option>
      </select>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./script.js?v=2"></script>
</body>

</html>
