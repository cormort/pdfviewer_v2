  <div id="app-container">
    <!-- Shown only inside the LINE in-app browser (see script.js) -->
    <div id="inapp-browser-banner">
      <div class="banner-text">
        <strong>目前在 LINE 內建瀏覽器</strong>
        <span>開檔與暫存可能受限。也可點右上角 ⋯ 改用其他瀏覽器開啟。</span>
      </div>
      <button id="inapp-open-external" type="button" class="btn-primary">用預設瀏覽器開啟</button>
      <button id="inapp-banner-close" type="button" class="close-btn" title="關閉提示" aria-label="關閉提示"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
    </div>
    <div id="toolbar-toggle-tab" title="開啟選單：開檔、搜尋、翻頁">
      <svg class="icon icon-menu" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg>
      <svg class="icon icon-close" aria-hidden="true" focusable="false"><use href="#i-x"/></svg>
      <span class="fab-label label-menu">選單</span>
      <span class="fab-label label-close">關閉</span>
    </div>
    <header id="toolbar">
      <div class="title-section">
        <div class="app-logo">PDF</div>
        <h1 class="app-title">專業工作室</h1>
      </div>

      <div class="file-section">
        <button id="restore-session-btn" class="btn-secondary" style="display: none;" title="開啟上次使用的檔案" aria-label="開啟上次使用的檔案"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-rotate-ccw"/></svg> 開啟上次檔案</button>
        <button id="clear-session-btn" class="btn-danger" style="display: none;" title="清除工作階段" aria-label="清除工作階段"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-trash-2"/></svg>
          清除</button>
        <label for="fileInput" class="custom-file-upload">
          <span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-folder-open"/></svg> 開啟 PDF</span>
          <input type="file" id="fileInput" multiple accept="application/pdf">
        </label>
      </div>

      <div class="search-section">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="搜尋關鍵字..." autocomplete="off">
          <button id="clear-search-btn" type="button" title="清除搜尋" hidden aria-label="清除搜尋"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
        </div>
        <button id="search-action-button" class="btn-primary">搜尋</button>
        <select id="fileFilterDropdown">
          <option value="all">所有檔案</option>
        </select>
      </div>

      <div class="file-switch-section">
        <select id="fileSwitchDropdown" title="在已載入的檔案之間切換">
          <option value="">-- 選擇檔案 --</option>
        </select>
      </div>

      <div class="nav-section">
        <button id="go-to-first-page" title="第一頁" aria-label="第一頁"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevrons-left"/></svg></button>
        <button id="prev-page" title="上一頁" aria-label="上一頁"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-left"/></svg></button>
        <div id="page-num-display">第 - / - 頁</div>
        <button id="next-page" title="下一頁" aria-label="下一頁"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-right"/></svg></button>
        <input type="number" id="page-to-go" min="1" value="1" title="前往頁面">
        <button id="go-to-page-btn" class="btn-secondary">前往</button>
      </div>

      <div class="app-version">v2 · 2026-09</div>
    </header>

    <main id="main-content">
      <section id="pdf-container">
        <!-- Empty State -->
        <div id="empty-state-wrap">
          <div id="empty-state" class="empty-state-guide" role="button" tabindex="0">
            <div class="icon" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-file-text"/></svg></div>
            <h2>開始您的專案</h2>
            <p>點這裡開啟 PDF，即可使用關鍵字搜尋、分頁筆記等功能。</p>
          </div>
          <!-- instructions.html was precached but had no way in from the UI -->
          <a id="help-link" href="instructions.html" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-book-open"/></svg> 使用說明</a>
        </div>

        <!-- PDF Content Wrapper -->
        <div id="canvas-wrapper" style="position: relative; display: none;">
          <canvas id="pdf-canvas" aria-hidden="true"></canvas>
          <div id="text-layer"></div>
          <canvas id="drawing-canvas" aria-hidden="true"></canvas>
          <div id="magnifier-glass">
            <canvas id="magnifier-canvas"></canvas>
          </div>
          <div id="notes-layer"></div>
        </div>
      </section>

      <div id="resizer"></div>

      <div id="search-results-panel">
        <h3 id="results-panel-header" title="展開或收起搜尋結果">
          <span class="panel-title"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg> 搜尋結果</span>
          <span id="results-count"></span>
          <span class="results-stepper">
            <button id="prev-result-btn" type="button" title="上一筆結果" aria-label="上一筆結果"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-left"/></svg></button>
            <button id="next-result-btn" type="button" title="下一筆結果" aria-label="下一筆結果"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-right"/></svg></button>
          </span>
        </h3>
        <button id="results-collapse-btn" type="button" title="收起搜尋結果" aria-label="收起搜尋結果"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
        <div id="panel-dropdown-container">
          <select id="panelFileFilterDropdown">
            <option value="all">所有檔案</option>
          </select>
          <select id="panelResultsDropdown">
            <option value="">搜尋結果</option>
          </select>
        <button id="results-view-toggle" title="切換列表／縮圖：橫式（寬）的文件建議用列表，直式（長）的文件建議用縮圖" aria-label="切換列表／縮圖：橫式（寬）的文件建議用列表，直式（長）的文件建議用縮圖"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-layout-grid"/></svg><span id="results-view-label">縮圖</span></button>
        <button id="export-results-pdf-btn" title="把搜尋到的頁面匯出成一份含目錄的 PDF" aria-label="把搜尋到的頁面匯出成一份含目錄的 PDF"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-file-down"/></svg> 匯出結果 PDF</button>
        </div>
        <div id="results-list"></div>
      </div>
    </main>

    <!-- Mobile page arrows. Kept out of #toolbar on purpose: its
         backdrop-filter makes it a containing block for position:fixed, so
         arrows nested there would be positioned against the 280px drawer
         rather than the viewport. -->
    <button id="page-prev-overlay" class="page-arrow" type="button" title="上一頁" aria-label="上一頁">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-left"/></svg>
    </button>
    <button id="page-next-overlay" class="page-arrow" type="button" title="下一頁" aria-label="下一頁">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chevron-right"/></svg>
    </button>

    <!-- Floating Action Buttons -->
    <div id="floating-action-buttons" class="fab-container">
      <!-- Overlay Panel Trigger (Mobile Speed Dial) -->
      <button id="main-fab" class="btn-primary" title="工具選單" aria-label="工具選單">
        <span class="icon" aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-wrench"/></svg></span>
        <span class="fab-label">工具</span>
      </button>

      <div class="fab-menu" id="fab-speed-dial">
        <div class="fab-group-label">分享與截圖</div>
        <button id="share-page-btn" class="btn-secondary" title="分享 PDF" aria-label="分享 PDF">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-share-2"/></svg></span>
        </button>
        <button id="share-link-btn" class="btn-secondary" title="分享本站連結" aria-label="分享本站連結">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-link-2"/></svg></span>
        </button>

        <div class="fab-divider"></div>
        <div class="fab-group-label">顯示</div>
        <button id="fab-fit-width-btn" class="btn-secondary fit-width-btn" title="符合寬度" aria-label="符合寬度">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-move-horizontal"/></svg></span>
        </button>
        <button id="fab-fit-height-btn" class="btn-secondary fit-height-btn" title="符合高度" aria-label="符合高度">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-move-vertical"/></svg></span>
        </button>

        <div class="fab-divider"></div>
        <div class="fab-group-label">文字工具</div>
        <button id="toggle-underline-btn" class="btn-secondary" title="切換搜尋底線" aria-label="切換搜尋底線">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-underline"/></svg></span>
        </button>
        <button id="toggle-highlighter-btn" class="btn-secondary" title="螢光筆標記選擇內容" aria-label="螢光筆標記選擇內容">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-highlighter"/></svg></span>
        </button>
        <button id="clear-highlighter-btn" class="btn-secondary" title="清除本頁標記" aria-label="清除本頁標記">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eraser"/></svg></span>
        </button>

        <div class="fab-divider"></div>
        <div class="fab-group-label">選取與筆記</div>
        <button id="toggle-text-selection-btn" class="btn-secondary" title="選擇文字" aria-label="選擇文字">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-text-cursor"/></svg></span>
        </button>
        <button id="toggle-paragraph-selection-btn" class="btn-secondary" title="選擇段落" aria-label="選擇段落">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pilcrow"/></svg></span>
        </button>
        <button id="copy-page-text-btn" class="btn-secondary" title="複製選擇內容" aria-label="複製選擇內容">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-clipboard-copy"/></svg></span>
        </button>
        <button id="view-notes-btn" class="btn-secondary" title="所有分頁筆記" aria-label="所有分頁筆記">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-notebook-text"/></svg></span>
        </button>
        <button id="toggle-local-magnifier-btn" class="btn-secondary" title="放大鏡 (點擊 PDF)" aria-label="放大鏡 (點擊 PDF)">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-zoom-in"/></svg></span>
        </button>
        <button id="toggle-notes-btn" class="btn-secondary" title="新增筆記 (點擊 PDF)" aria-label="新增筆記 (點擊 PDF)">
          <span class="icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg></span>
        </button>
      </div>
    </div>

    <!-- Zoom Controls Overlay -->
    <div class="page-nav-overlay">
      <button id="zoom-out-btn" class="zoom-out-btn" title="縮小" aria-label="縮小"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-minus"/></svg></button>
      <div id="zoom-level-display">100%</div>
      <button id="zoom-in-btn" class="zoom-in-btn" title="放大" aria-label="放大"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg></button>
      <div class="toolbar-divider"></div>
      <button id="fit-width-btn" class="fit-width-btn">寬度</button>
      <button id="fit-height-btn" class="fit-height-btn">高度</button>
      <div class="toolbar-divider"></div>
      <div id="page-chip" aria-live="polite">–/–</div>
      <input type="range" id="page-slider" min="1" max="1" value="1" disabled>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
      <div class="loading-content">
        <div class="loading-spinner-large"></div>
        <div id="loading-message" class="loading-message">載入中...</div>
      </div>
    </div>

    <!-- Note Modal -->
    <div id="note-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="note-modal-title">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="note-modal-title">新增筆記</h3>
          <button id="close-note-modal" class="close-btn" title="關閉" aria-label="關閉筆記視窗"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
        </div>
        <div class="modal-body">
          <textarea id="note-content" placeholder="在此輸入筆記內容..."></textarea>
        </div>
        <div class="modal-footer">
          <button id="delete-note-btn" class="btn-danger" style="display:none;">刪除</button>
          <button id="cancel-note-btn" class="btn-secondary">取消</button>
          <button id="save-note-btn" class="btn-primary">儲存筆記</button>
        </div>
      </div>
    </div>

    <!-- Notes List Panel -->
    <div id="notes-list-panel" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="notes-list-title">
      <div class="modal-content side-panel">
        <div class="modal-header">
          <h3 id="notes-list-title">所有分頁筆記</h3>
          <button id="close-notes-list" class="close-btn" title="關閉" aria-label="關閉筆記清單"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
        </div>
        <div id="notes-list-container" class="modal-body">
          <!-- Notes will be loaded here -->
        </div>
        <div class="modal-footer backup-actions">
          <button id="export-notes-btn" class="btn-secondary" title="將所有筆記匯出為 JSON 檔案" aria-label="將所有筆記匯出為 JSON 檔案"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-download"/></svg> 匯出備份</button>
          <button id="import-notes-trigger-btn" class="btn-secondary" title="從 JSON 備份檔案匯入筆記" aria-label="從 JSON 備份檔案匯入筆記"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-upload"/></svg> 匯入備份</button>
          <input type="file" id="import-notes-input" accept=".json" class="sr-only">
        </div>
      </div>
    </div>

    <!-- Magnifier Zoom Controls -->
    <div id="local-magnifier-zoom-controls" class="magnifier-zoom-overlay" style="display: none;">
      <label>縮放：</label>
      <select id="local-magnifier-zoom-selector">
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
        <option value="2.5" selected>2.5x</option>
        <option value="3.0">3.0x</option>
        <option value="3.5">3.5x</option>
      </select>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./script.js?v=62"></script>
</body>

</html>
